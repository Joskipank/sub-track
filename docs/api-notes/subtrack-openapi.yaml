openapi: 3.0.3
info:
  title: SubTrack API
  version: 0.1.0
  description: MVP backend contract for SubTrack demo.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/users/me:
    get:
      tags: [users]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
  /api/v1/categories:
    get:
      tags: [categories]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
  /api/v1/subscriptions:
    get:
      tags: [subscriptions]
      responses:
        '200':
          description: Subscriptions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionResponse'
    post:
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
  /api/v1/subscriptions/upcoming:
    get:
      tags: [subscriptions]
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
      responses:
        '200':
          description: Active subscriptions with upcoming charges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpcomingSubscriptionResponse'
  /api/v1/subscriptions/{id}:
    get:
      tags: [subscriptions]
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Subscription by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
    put:
      tags: [subscriptions]
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
    delete:
      tags: [subscriptions]
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Deleted
  /api/v1/notifications:
    get:
      tags: [notifications]
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
      responses:
        '200':
          description: Notifications for window today..today+days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
  /api/v1/analytics/summary:
    get:
      tags: [analytics]
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
  /api/v1/imports/start:
    post:
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStartRequest'
      responses:
        '200':
          description: Started import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
  /api/v1/imports:
    get:
      tags: [imports]
      responses:
        '200':
          description: Import history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportJobResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SubscriptionId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        timezone:
          type: string
          nullable: true
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    SubscriptionRequest:
      type: object
      required: [serviceName, amount, currency, billingPeriod, nextBillingDate]
      properties:
        serviceName:
          type: string
          maxLength: 255
        categoryId:
          type: integer
          format: int64
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billingPeriod:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY]
        nextBillingDate:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELED]
          nullable: true
    SubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serviceName:
          type: string
        category:
          type: string
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
        billingPeriod:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY]
        nextBillingDate:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELED]
    UpcomingSubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serviceName:
          type: string
        category:
          type: string
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
        billingPeriod:
          type: string
          enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY]
        nextBillingDate:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELED]
        daysUntilBilling:
          type: integer
          format: int64
    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        message:
          type: string
        scheduledAt:
          type: string
        status:
          type: string
    AnalyticsSummaryResponse:
      type: object
      properties:
        totalMonthly:
          type: number
          format: double
        totalYearly:
          type: number
          format: double
        activeSubscriptions:
          type: integer
          format: int64
    ImportStartRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [GMAIL, YANDEX, MAIL_RU, BANK_API]
    ImportJobResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
        status:
          type: string
